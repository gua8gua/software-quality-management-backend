[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "software-quality-management-backend"
version = "0.1.0"
description = "Backend foundation for software quality management"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=43,<47",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-java>=0.23,<0.24",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["build", "vendor", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
